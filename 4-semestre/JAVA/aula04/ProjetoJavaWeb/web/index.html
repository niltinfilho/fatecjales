<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cadastro de pessoa</title>
 <style>
 body { font-family: Arial, sans-serif; background: #f4f6f8;
 color: #222; margin: 0; padding: 40px; }
 main { max-width: 500px; margin: auto; background: white;
 padding: 30px; border: 1px solid #ccc; border-radius: 8px; }
 label { display: block; margin-top: 16px; font-weight: bold; }
 input { box-sizing: border-box; width: 100%; margin-top: 6px;
 padding: 10px; border: 1px solid #555; border-radius: 4px; }
 button { width: 100%; margin-top: 24px; padding: 12px; border: 0;
 border-radius: 4px; background: #1d4ed8; color: white;
 font-size: 16px; cursor: pointer; }
 button:hover { background: #163ca6; }
 </style>
</head>
<body>
<main>
 <h1>Cadastro de pessoa</h1>
 <p>Preencha os campos para enviar os dados ao servidor.</p>
 <form action="cadastro" method="post">
 <label for="nome">Nome</label>
 <input type="text" id="nome" name="nome" required>
 <label for="idade">Idade</label>
 <input type="number" id="idade" name="idade"
 min="0" max="130" required>
 <button type="submit">Cadastrar</button>
 </form>
</main>
</body>
</html>
