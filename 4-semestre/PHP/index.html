<!DOCTYPE html>

<head>

  <style>
    /* Complemento do style.css: só organiza a lista de aulas, mantendo as mesmas cores e cantos arredondados */
    main { width: 100%; max-width: 1100px; box-sizing: border-box; padding: 32px 16px; display: flex; flex-direction: column; align-items: center; }
    #busca { max-width: 500px; margin-bottom: 28px; }
    .aulas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; width: 100%; align-items: start; }
    .aula { background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
    .aula h2 { margin: 0; font-size: 1.3rem; color: #581c87; }
    .aula p { margin: 2px 0 12px; font-size: 0.9rem; text-align: left; color: #64748b; opacity: 1; }
    .aula ul { list-style: none; margin: 0; padding: 0; }
    .aula li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #e2e8f0; }
    .nome { flex: 1 1 150px; font-size: 0.95rem; font-weight: 600; color: #334155; }
    .acoes { display: flex; gap: 6px; }
    .aula a, dialog button { margin: 0; padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; text-decoration: none; }
    .aula a { background: #7c3aed; color: #ffffff; }
    .aula a:hover { background: #6d28d9; }
    .aula button, dialog button { background: #f3e8ff; color: #581c87; padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; box-shadow: none; }
    .aula button:hover, dialog button:hover { background: #e9d5ff; transform: none; }
    dialog button.ativa { background: #7c3aed; color: #ffffff; }
    .aviso { font-size: 0.95rem; margin-top: 32px; }
    code { background: rgba(255, 255, 255, 0.15); padding: 2px 6px; border-radius: 6px; }
    :focus-visible { outline: 3px solid #c084fc; outline-offset: 2px; }

    dialog { width: min(900px, 94vw); max-height: 88vh; box-sizing: border-box; padding: 20px; border: none; border-radius: 12px; background: #ffffff; color: #1e293b; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); }
    dialog[open] { display: flex; flex-direction: column; gap: 12px; }
    dialog::backdrop { background: rgba(46, 16, 101, 0.75); }
    .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #cod-titulo { margin: 0; font-size: 1.15rem; color: #581c87; }
    #abas { display: flex; flex-wrap: wrap; gap: 6px; }
    pre { margin: 0; overflow: auto; max-height: 58vh; background: #1e1b4b; color: #f3e8ff; padding: 16px; border-radius: 8px; font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; tab-size: 2; }
  </style>
</head>

<body>
  <main>

    <div id="abas"></div>

    <div><button type="button" id="copiar">Copiar código</button></div>

 charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>04 - Concatenar<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Concatenar\" ?><\/h1>\n  <?php\n  $texto1 = \"PHP siginifica... \";\n  $texto2 = \"PHP: Hypertext Preprocessor\";\n  echo $texto1 . $texto2;\n  ?>\n<\/body>\n\n<\/html>", "aula03/05-aspas.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>05 - Aspas<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Aspas\" ?><\/h1>\n  <?php\n  $carro = \"Camaro\";\n  echo \"\\\"Eu tenho um $carro\\\" <br>\";\n  echo '\\'Eu tenho um $carro\\' <br>'\n  ?>\n\n<\/body>\n\n<\/html>", "aula03/06-tipo.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>06 - Tipo<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Tipo\" ?><\/h1>\n  <?php\n  $var1 = 10;\n  $var2 = 35.86;\n  $var3 = \"PHP Hypertext Preprocessor\";\n  $var4 = false;\n  $var5 = null;\n  echo \"<p><strong>$var1<\/strong> é do tipo <strong>\" . gettype($var1) . \"<\/strong><\/p>\";\n  echo \"<p><strong>$var2<\/strong> é do tipo <strong>\" . gettype($var2) . \"<\/strong><br><\/p>\";\n  echo \"<p><strong>$var3<\/strong> é do tipo <strong>\" . gettype($var3) . \"<\/strong><br><\/p>\";\n  echo \"<p><strong>$var4<\/strong> é do tipo <strong>\" . gettype($var4) . \"<\/strong><br><\/p>\";\n  echo \"<p><strong>$var5<\/strong> é do tipo <strong>\" . gettype($var5) . \"<\/strong><br><\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula03/07-aritmeticos.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>07 - Aritméticos<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Aritméticos\" ?><\/h1>\n  <?php\n  $n1 = 3;\n  $n2 = 2;\n  echo \"<p>A soma de <strong>$n1 + $n2 = \" . ($n1 + $n2) . \"<\/strong><br><\/p>\";\n  echo \"<p>A subtração de <strong>$n1 - $n2 = \" . ($n1 - $n2) . \"<\/strong><br><\/p>\";\n  echo \"<p>A multiplicação de <strong>$n1 * $n2 = \" . ($n1 * $n2) . \"<\/strong><br><\/p>\";\n  echo \"<p>A divisão de <strong>$n1 / $n2 = \" . ($n1 / $n2) . \"<\/strong><br><\/p>\";\n  echo \"<p>A módulo de <strong>$n1 % $n2 = \" . ($n1 % $n2) . \"<\/strong><br><\/p>\";\n  $n3 = \"10\";\n  echo \"<p>A soma de <strong>$n1 + \\\"$n3\\\" = \" . ($n1 + $n3) . \"<\/strong><\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula03/08-atribuicao.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>08 - Atribuição<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Atribuição\" ?><\/h1>\n\n  <?php\n  $var1 = 2;\n  ?>\n  <p><strong><?= $var1 . \" += 10 -> <\/strong>\" . ($var1 += 10) . \"<br>\" ?><\/p>\n  <p><strong><?= $var1 . \" *= 10 -> <\/strong>\" . ($var1 *= 10) . \"<br>\" ?><\/p>\n  <p><strong><?= $var1 . \" /= 10 -> <\/strong>\" . ($var1 /= 10) . \"<br>\" ?><\/p>\n  <p><strong><?= $var1 . \" -= 10 -> <\/strong>\" . ($var1 -= 10) . \"<br>\" ?><\/p>\n<\/body>\n\n<\/html>", "aula03/09-relacionais.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>09 - Relacionais<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Relacionais\" ?><\/h1>\n  <?php\n  $num1 = 5;\n  $num2 = 3;\n  $tipo = \"s\";\n  $r = $tipo == \"s\" ? $num1 + $num2 : $num1 * $num2;\n  ?>\n  <p>O $tipo é: <strong><?= $tipo ?><\/strong><\/p>\n  <p>Operação: $tipo == \"s\" ? $num1 + $num2 : $num1 * $num2<\/p>\n  <p>O resultado é: <strong><?= $r ?><\/strong><\/p>\n<\/body>\n\n<\/html>", "aula03/10-logico.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>10 - Lógico<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Lógico\" ?><\/h1>\n  <?php\n  $ano = 2000;\n  $idade = 2026 - $ano;\n\n  $tipo = ($idade >= 18 && $idade < 65) ? \"é obrigatório\" : \"não é obrigatório\";\n  ?>\n\n  <p>\n    Quem nasceu em <strong><?= $ano ?>\n    <\/strong> tem a idade de <strong><?= $idade ?>\n    <\/strong> anos\n  <\/p>\n  <p>Seu voto <strong><?= $tipo ?><\/strong>!<\/p>\n<\/body>\n\n<\/html>", "aula03/11-get-formulario.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>11 - Get<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Get\" ?><\/h1>\n  <form action=\"<?= $_SERVER[\"PHP_SELF\"] ?>\">\n    <label for=\"num1\">Número 1:<\/label>\n    <input type=\"number\" name=\"num1\" id=\"num1\" value=\"<?= $_GET[\"num1\"] ?? 0 ?>\">\n    <label for=\"num1\">Número 2:<\/label>\n    <input type=\"number\" name=\"num2\" id=\"num2\" value=\"<?= $_GET[\"num2\"] ?? 0 ?>\">\n    <input type=\"submit\" value=\"Calcular\">\n  <\/form>\n\n  <?php\n  $n1 = $_GET[\"num1\"] ?? 0;\n  $n2 = $_GET[\"num2\"] ?? 0;\n  if ($n1 + $n2 > 0) {\n    echo \"<br><br><p style=\\\"font-size: 1.5rem\\\">A soma entre os valores digitados é igual a <strong>\" . $n1 + $n2 . \"<\/strong><\/p>\";\n  }\n  ?>\n\n  <script>\n    if (window.history.replaceState) {\n      const urlLimpa = window.location.protocol + \"//\" + window.location.host + window.location.pathname;\n\n      window.history.replaceState({\n        path: urlLimpa\n      }, '', urlLimpa);\n    }\n\n    let n1 = document.querySelector(\"#num1\");\n    let n2 = document.querySelector(\"#num2\");\n\n    n1.addEventListener(\"focus\", () => {\n      n1.value = \"\";\n    });\n\n    n1.addEventListener(\"focusout\", () => {\n      if (n1.value == \"\" || n1.value < 0) {\n        n1.value = 0;\n      }\n    });\n\n    n2.addEventListener(\"focus\", () => {\n      n2.value = \"\";\n    });\n\n    n2.addEventListener(\"focusout\", () => {\n      if (n2.value == \"\" || n2.value < 0) {\n        n2.value = 0;\n      }\n    });\n  <\/script>\n<\/body>\n\n<\/html>", "aula03/11-get.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>11 - Get<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1><?= \"Get\" ?><\/h1>\n  <?php\n  $n1 = $_GET[\"a\"];\n  $n2 = $_GET[\"b\"];\n  ?>\n  <p>\n    Na URL digite: <br>\n    <em>.../aula03/11-get.php?a=10&b=50<\/em> <br>\n    para não aparecer o erro!\n  <\/p>\n  <p>A soma entre os valores digitados é igual a <strong><?= $n1 + $n2 ?><\/strong><\/p>\n<\/body>\n\n<\/html>", "aula04/form1.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Integrando HTML e PHP<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Formulário 1<\/h1>\n  <form method=\"get\" action=\"valor.php\">\n    <label for=\"valor\">Valor:<\/label>\n    <input type=\"text\" name=\"valor\" id=\"valor\">\n    <input type=\"submit\" value=\"Parte inteira um número\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula04/valor.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Recebendo valor do HTML<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  $valor = $_GET[\"valor\"];\n  ?>\n  <h1>Recebendo dados do Formulário 1<\/h1>\n  <p>A parte inteira de <em><?= $valor ?><\/em> é <strong><?= intval($valor) ?><\/strong><\/p>\n  <br>\n  <a href=\"form1.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula04/form2.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Integrando HTML e PHP<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Formulário 2<\/h1>\n  <form method=\"get\" action=\"idade.php\">\n    <label for=\"nome\">Nome:<\/label>\n    <input type=\"text\" name=\"nome\" id=\"nome\">\n\n    <label for=\"nasc\">Ano de nascimento:<\/label>\n    <input type=\"number\" name=\"nasc\" id=\"nasc\">\n\n    <fieldset>\n      <legend>Sexo:<\/legend>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"sexo\" id=\"masc\" value=\"masculino\">\n        <label for=\"masc\">Masculino<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"sexo\" id=\"fem\" value=\"feminino\">\n        <label for=\"fem\">Feminino<\/label>\n      <\/div>\n    <\/fieldset>\n    <input type=\"submit\" value=\"Enviar\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula04/idade.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Recebendo valor do HTML<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  $nome = $_GET[\"nome\"];\n  $nasc = $_GET[\"nasc\"];\n  $sexo = $_GET[\"sexo\"];\n  $idade = date(\"Y\") - $nasc;\n  ?>\n  <h1>Recebendo dados do Formulário 2<\/h1>\n  <p><?= $nome ?> é do sexo <em><?= $sexo ?><\/em> e tem <strong><?= $idade ?><\/strong> anos de idade<\/p>\n  <br>\n  <a href=\"form2.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula05/if_else.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de decisão if<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Estrutura de decisão if<\/h1>\n  <form method=\"get\" action=\"if_else.php\">\n    <label for=\"idade\">Idade:<\/label>\n    <input type=\"number\" name=\"idade\" id=\"idade\">\n    <input type=\"submit\" value=\"Verificar\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula05/if_else.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de decisão if<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Recebendo dados do formulário<\/h1>\n  <br>\n\n  <?php\n  $idade = $_GET[\"idade\"];\n\n  if ($idade == NULL) {\n    echo \"<p>Volte e digite sua idade!<\/p>\";\n  } elseif ($idade >= 18) {\n    echo \"<p>Você tem $idade anos!<br>Com essa idade você já pode tirar habilitação.<\/p>\";\n  } else {\n    echo \"<p>Você tem $idade anos!<br>Com essa idade você ainda não pode tirar habilitação.<\/p>\";\n  }\n  ?>\n\n  <a href=\"if_else.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula05/media.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Registro de notas<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Registro de notas<\/h1>\n  <form method=\"get\" action=\"media.php\">\n    <label for=\"nome\">Nome do aluno:<\/label>\n    <input type=\"text\" name=\"nome\" id=\"nome\" required>\n\n    <label for=\"nota1\">Nota 1:<\/label>\n    <input type=\"text\" name=\"nota1\" id=\"nota1\">\n\n    <label for=\"nota2\">Nota 2:<\/label>\n    <input type=\"text\" name=\"nota2\" id=\"nota2\">\n\n    <label for=\"nota3\">Nota 3:<\/label>\n    <input type=\"text\" name=\"nota3\" id=\"nota3\">\n\n    <label for=\"nota4\">Nota 4:<\/label>\n    <input type=\"text\" name=\"nota4\" id=\"nota4\">\n\n    <input type=\"submit\" value=\"Verificar\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula05/media.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de decisão if<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Relatório da média do aluno<\/h1>\n  <br>\n\n  <?php\n  $nome = $_GET[\"nome\"];\n  $nota1 = $_GET[\"nota1\"];\n  $nota2 = $_GET[\"nota2\"];\n  $nota3 = $_GET[\"nota3\"];\n  $nota4 = $_GET[\"nota4\"];\n\n  $camposVazios = 0;\n\n  if ($nota1 == NULL) {\n    $camposVazios++;\n  }\n\n  if ($nota2 == NULL) {\n    $camposVazios++;\n  }\n\n  if ($nota3 == NULL) {\n    $camposVazios++;\n  }\n\n  if ($nota4 == NULL) {\n    $camposVazios++;\n  }\n\n  if ($camposVazios > 0) {\n    if ($camposVazios == 1) {\n      echo \"Existe um campo vazio! Volte e preencha-o.\";\n    } else {\n      echo \"Existem campos vazios! Volte e preencha-os.\";\n    }\n  } else {\n    $media = ($nota1 + $nota2 + $nota3 + $nota4) / 4;\n    echo \"<p>$nome obteve a média $media.<\/p>\";\n    echo \"<p>O aluno(a) está \" . ($media >= 6 ? \"aprovado!<\/p>\" : \"reprovado!<\/p>\");\n  }\n  ?>\n\n  <a href=\"media.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula06/calculadora.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura condicional switch<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Calculadora simples<\/h1>\n  <form method=\"get\" action=\"calculadora.php\">\n    <label for=\"valor1\">Informe o primeiro valor:<\/label>\n    <input type=\"number\" name=\"valor1\" id=\"valor1\">\n\n    <label for=\"valor2\">Informe o segundo valor:<\/label>\n    <input type=\"number\" name=\"valor2\" id=\"valor2\">\n\n    <fieldset>\n      <legend>Escolha a operação:<\/legend>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"adicao\" value=\"adicao\">\n        <label for=\"adicao\">Adição<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"subtracao\" value=\"subtracao\">\n        <label for=\"subtracao\">Subtração<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"multiplicacao\" value=\"multiplicacao\">\n        <label for=\"multiplicacao\">Multiplicação<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"divisao\" value=\"divisao\">\n        <label for=\"divisao\">Divisão<\/label>\n      <\/div>\n    <\/fieldset>\n\n    <input type=\"submit\" value=\"Calcular\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula06/calculadora.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura condicional switch<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Resultado da operação<\/h1>\n\n  <?php\n  $valor1 = $_GET[\"valor1\"];\n  $valor2 = $_GET[\"valor2\"];\n  $operacao = $_GET[\"operacao\"];\n\n  if ($valor1 == NULL || $valor2 == NULL || $operacao == NULL) {\n    echo \"<p>O formulário está incompleto! Volte e preencha-o.<\/p>\";\n  } else {\n    echo \"<p>Os valores digitados foram <strong>$valor1<\/strong> e <strong>$valor2<\/strong><\/p><br>\";\n\n    switch ($operacao) {\n      case \"adicao\":\n        $resultado = $valor1 + $valor2;\n        echo \"<p>O resultado da operação $valor1 + $valor2 é igual a <strong>$resultado<\/strong><\/p>\";\n        break;\n      case \"subtracao\":\n        $resultado = $valor1 - $valor2;\n        echo \"<p>O resultado da operação $valor1 - $valor2 é igual a <strong>$resultado<\/strong><\/p>\";\n        break;\n      case \"multiplicacao\":\n        $resultado = $valor1 * $valor2;\n        echo \"<p>O resultado da operação $valor1 * $valor2 é igual a <strong>$resultado<\/strong><\/p>\";\n        break;\n      case \"divisao\":\n        $resultado = $valor1 / $valor2;\n        echo \"<p>O resultado da operação $valor1 / $valor2 é igual a <strong>$resultado<\/strong><\/p>\";\n        break;\n      default:\n        echo \"<p>Não foi selecionada uma operação!<\/p>\";\n    }\n  }\n  ?>\n\n  <a href=\"calculadora.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula06/switch.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura condicional switch<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Pagamento de compras<\/h1>\n  <form method=\"get\" action=\"switch.php\">\n    <label for=\"valor\">Informe o valor total:<\/label>\n    <input type=\"number\" name=\"valor\" id=\"valor\" required>\n\n    <fieldset>\n      <legend>Pagamento:<\/legend>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"operacao1\" value=\"1\">\n        <label for=\"operacao1\">Pagamento à vista e desconto de 10%<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"operacao2\" value=\"2\">\n        <label for=\"operacao2\">Pagamento em 30 dias e juros de 5%<\/label>\n      <\/div>\n\n      <div class=\"radios\">\n        <input type=\"radio\" name=\"operacao\" id=\"operacao3\" value=\"3\">\n        <label for=\"operacao3\">Pagamento em 60 dias e juros de 10%<\/label>\n      <\/div>\n    <\/fieldset>\n\n    <input type=\"submit\" value=\"Calcular\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula06/switch.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura condicional switch<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Confirmação de pagamento<\/h1>\n\n  <?php\n  $valor = $_GET[\"valor\"];\n  $operacao = $_GET[\"operacao\"];\n\n  if ($valor == NULL || empty($operacao)) {\n    echo \"<p>O formulário está incompleto! Volte e preencha-o.<\/p>\";\n  } else {\n    echo \"<p>O valor da compra é <strong>R\\$\" . number_format($valor, 2, \",\") . \"<\/strong><\/p><br>\";\n\n    switch ($operacao) {\n      case 1:\n        $resultado = $valor - ($valor * 0.10);\n        echo \"<p>O valor total com pagamento à vista e desconto de 10% é <strong>R\\$\" . number_format($resultado, 2, \",\") . \"<\/strong><\/p>\";\n        break;\n      case 2:\n        $resultado = $valor + ($valor * 0.05);\n        echo \"<p>O valor total com pagamento em 30 dias e juros de 5% é <strong>R\\$\" . number_format($resultado, 2, \",\") . \"<\/strong><\/p>\";\n        break;\n      case 3:\n        $resultado = $valor + ($valor * 0.10);\n        echo \"<p>O valor total com pagamento em 60 dias e juros de 10% é <strong>R\\$\" . number_format($resultado, 2, \",\") . \"<\/strong><\/p>\";\n        break;\n      default:\n        echo \"<p>Não foi selecionada uma forma de pagamento!<\/p>\";\n    }\n  }\n  ?>\n\n  <a href=\"switch.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula07/while.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de repetição while<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Contagem de 1 a 10<\/h1>\n  <?php\n  $contador = 1;\n  while ($contador <= 10) {\n    echo $contador . \"<br>\";\n    $contador++;\n  }\n  ?>\n<\/body>\n\n<\/html>", "aula07/while_dinamico.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de repetição while<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>While Dinâmico<\/h1>\n\n  <form method=\"get\" action=\"while_dinamico_mostra.php\">\n    <?php\n    $contador = 1;\n    while ($contador <= 5) {\n      echo \"<p style='color: #000'>$contador ° valor: <input type='number' name='v$contador'/> <\/p>\";\n      $contador++;\n    }\n    ?>\n    <input type=\"submit\" value=\"Enviar\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula07/while_dinamico_mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de repetição while<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Mostrando os valores<\/h1>\n  <?php\n  $i = 1;\n  while ($i <= 5) {\n    $valor = $_GET[\"v\" . $i];\n    if ($valor == NULL) {\n      echo \"<p>Faltou informar o $i ° valor<\/p>\";\n    } else {\n      echo \"<p>$i ° valor: $valor<\/p>\";\n    }\n    $i++;\n  }\n  ?>\n  <br>\n  <a href=\"while_dinamico.php\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula07/contador.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Formulário de contador<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Formulário de contador<\/h1>\n\n  <form method=\"get\" action=\"contador_mostra.php\">\n    <label for=\"nInicial\">Número inicial:<\/label>\n    <input type=\"number\" name=\"nInicial\" id=\"nInicial\">\n\n    <label for=\"nFinal\">Número final:<\/label>\n    <input type=\"number\" name=\"nFinal\" id=\"nFinal\">\n\n    <label for=\"incDec\">Incremento/Decremento<\/label>\n    <select name=\"incDec\" id=\"incDec\">\n      <option value=\"\" selected disabled>Selecione uma opção<\/option>\n      <option value=\"1\">1<\/option>\n      <option value=\"2\">2<\/option>\n      <option value=\"3\">3<\/option>\n      <option value=\"4\">4<\/option>\n      <option value=\"5\">5<\/option>\n    <\/select>\n\n    <input type=\"submit\" value=\"Calcular\">\n  <\/form>\n\n<\/body>\n\n<\/html>", "aula07/contador_mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura condicional switch<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Resultado da contagem<\/h1>\n  <?php\n  $nInicial = $_GET[\"nInicial\"];\n  $nFinal = $_GET[\"nFinal\"];\n  $incDec = $_GET[\"incDec\"];\n\n  if ($nInicial == NULL || $nFinal == NULL || empty($incDec)) {\n    echo \"<p>Informações faltando! Volte e preencha o formulário corretamente.<\/p>\";\n  } else {\n    if ($nInicial < $nFinal) {\n      while ($nInicial <= $nFinal) {\n        echo \"<p>$nInicial<\/p>\";\n        $nInicial += $incDec;\n      }\n    } else {\n      while ($nFinal <= $nInicial) {\n        echo \"<p>$nInicial<\/p>\";\n        $nInicial -= $incDec;\n      }\n    }\n  }\n  ?>\n  <br>\n  <a href=\"contador.php\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula08/dowhile.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de repetição do-while<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Contagem de 1 a 10<\/h1>\n  <?php\n  $i = 1;\n  do {\n    echo \"<p>$i<\/p>\";\n    $i++;\n  } while ($i <= 10);\n  ?>\n<\/body>\n\n<\/html>", "aula08/tabuada.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Formulário de tabuada<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Selecione um número para fazer a tabuada<\/h1>\n  <form method=\"get\" action=\"tabuada_mostra.php\">\n    <label for=\"num\">Número:<\/label>\n    <select name=\"num\" id=\"num\">\n      <option value=\"\" selected disabled>Selecione uma opção<\/option>\n      <?php\n      $i = 1;\n      do {\n        echo \"<option value='$i'>$i<\/option>\";\n        $i++;\n      } while ($i <= 10);\n      ?>\n    <\/select>\n\n    <input type=\"submit\" value=\"Tabuada\">\n  <\/form>\n\n<\/body>\n\n<\/html>", "aula08/tabuada_mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Resposta da tabuada<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  $num = $_GET[\"num\"];\n  echo \"<h1>Mostrando tabuada do número $num:<\/h1>\";\n\n  $i = 1;\n  do {\n    echo \"<p>$num x $i = \" . $num * $i . \"<br><\/p>\";\n    $i++;\n  } while ($i <= 10);\n  ?>\n  <br>\n  <a href=\"tabuada.php\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula09/for.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Estrutura de repetição for<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Contagem de 1 a 10<\/h1>\n  <?php\n  for ($contador = 1; $contador <= 10; $contador++) {\n    echo \"<p>$contador<\/p>\";\n  }\n  ?>\n<\/body>\n\n<\/html>", "aula09/primo.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Formulário de números primos<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Informe um número para verificar se é primo:<\/h1>\n\n  <form method=\"get\" action=\"primo.php\">\n    <label for=\"num\">Número:<\/label>\n    <input type=\"number\" name=\"num\" id=\"num\">\n    <input type=\"submit\" value=\"É número primo?\">\n  <\/form>\n\n<\/body>\n\n<\/html>", "aula09/primo.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Resposta da tabuada<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  $num = $_GET[\"num\"];\n  $divisores = [];\n  echo \"<h1>Analisando o número $num:<\/h1><br>\";\n  for ($i = 1; $i <= $num; $i++) {\n    if ($num % $i == 0) {\n      $divisores[] = $i;\n    }\n  }\n  $totalDivisores = count($divisores);\n  ?>\n  <p>Valores multiplos: <?= implode(' ', $divisores); ?><\/p>\n  <p>Total de multiplos: <?= $totalDivisores; ?><\/p>\n  <p>Resultado: <?= $num ?> <?= $totalDivisores == 2 ? \"é PRIMO!\" : \"não é PRIMO!\" ?><\/p>\n  <a href=\"primo.html\">Voltar para o formulário<\/a>\n<\/body>\n\n<\/html>", "aula10/01-funcao_sem_par.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Função sem parâmetros<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  function bemVindo()\n  {\n    echo \"<p style='text-align: center'>Olá, seja bem-vindo!<\/p>\";\n  }\n  echo \"<h1>Invocando a função bemVindo()<\/h1>\";\n  bemVindo();\n\n  echo \"<h1>Função bemVindo() dentro do laço For<\/h1>\";\n  for ($i = 1; $i <= 5; $i++) {\n    bemVindo();\n  }\n  ?>\n<\/body>\n\n<\/html>", "aula10/02-funcao_com_par.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Função com parâmetros<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  function soma($a, $b)\n  {\n    $soma = $a + $b;\n    echo \"<p>A soma entre $a e $b é igual a $soma<\/p>\";\n  }\n  echo \"<h1>Invocando a função soma(3, 4)<\/h1>\";\n  soma(3, 4);\n\n  echo \"<h1>Invocando a função soma(8, 2)<\/h1>\";\n  soma(8, 2);\n\n  $x = 9;\n  $y = 15;\n  echo \"<h1>Invocando a função com \\$x valendo 9 e \\$y valendo 15<\/h1>\";\n  soma($x, $y);\n  ?>\n<\/body>\n\n<\/html>", "aula10/03-funcao_com_retorno.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Função com retorno<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  function soma($a, $b)\n  {\n    return $a + $b;\n  }\n  echo \"<h1>Função com retorno<\/h1>\";\n  $x = 20;\n  $y = 30;\n  echo \"<p>A soma entre $x e $y é igual a \" . soma($x, $y) . \"<\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula10/04-funcao_sem_retorno.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Função sem retorno<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  function soma($a, $b)\n  {\n    $soma = $a + $b;\n    echo \"<p>A soma entre $a e $b é igual a $soma<\/p>\";\n  }\n\n  echo \"<h1>Função sem retorno<\/h1>\";\n  $x = 9;\n  $y = 15;\n  soma($x, $y);\n  ?>\n<\/body>\n\n<\/html>", "aula10/05-funcao_multiplos.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Função com multiplos parâmetros<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Função com multiplos parâmetros<\/h1>\n  <?php\n  function soma()\n  {\n    $v = func_get_args(); // pega todos os argumentos passados para a função\n    $t = func_num_args(); //pega a quantidade de argumentos passados para a função\n    $s = 0;\n    for ($i = 0; $i < $t; $i++) {\n      $s += $v[$i];\n    }\n    return $s;\n  }\n\n  echo \"<h2>Invocando a função soma(3, 5, 2, 8, 9, 4)<\/h2>\";\n  $r = soma(3, 5, 2, 8, 9, 4);\n  echo \"<p>O resultado é $r<\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula10/06-funcao_valor.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Retorna parâmetro por valor<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Função que retorna parâmetro por valor<\/h1>\n  <?php\n  function valor($x)\n  {\n    $x += 2;\n    echo \"<p>O valor de x é igual a $x<\/p>\";\n  }\n\n  $a = 3;\n  valor($a);\n  echo \"<p>O valor de a é igual a $a<\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula10/07-funcao_ref.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Retorna parâmetro por referência<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Função que retorna parâmetro por referência<\/h1>\n  <?php\n  function referencia(&$x)\n  {\n    $x += 2;\n    echo \"<p>O valor de x é igual a $x<\/p>\";\n  }\n  $a = 3;\n  referencia($a);\n  echo \"<p>O valor de a é igual a $a<\/p>\";\n  ?>\n<\/body>\n\n<\/html>", "aula10/08-funcoes.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Com/sem parâmetros ou argumentos<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Função com/sem parâmetros ou argumentos<\/h1>\n  <?php\n  function texto()\n  {\n    echo \"<p>Esta função mostra o texto sem argumento<\/p>\";\n  }\n\n  function mostraValor($valor)\n  {\n    echo \"<p>Esta função mostra o valor informado com argumento: $valor<\/p>\";\n  }\n  ?>\n<\/body>\n\n<\/html>", "aula10/09-funcoes-mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Com/sem parâmetros ou argumentos<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <h1>Testando função com/sem parâmetros ou argumentos<\/h1>\n  <?php\n  include \"08-funcoes.php\";\n  texto();\n  mostraValor(5);\n  ?>\n<\/body>\n\n<\/html>", "aula11/exe01.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <form action=\"exe01_mostra.php\">\n    <?php\n    for ($i = 0; $i < 5; $i++) {\n      echo \"<p style='color: #000'>Vetor [$i]: <input type='text' name='i$i'><\/p>\";\n    }\n    ?>\n    <input type=\"submit\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula11/exe01_mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  echo \"<h2>Recebendo os dados e mostrando com echo<\/h2>\";\n  for ($i = 0; $i < 5; $i++) {\n    $valores[] = $_GET[\"i$i\"];\n    echo $_GET[\"i$i\"] . \"<br>\";\n  }\n\n  echo \"<br><h2>Mostrando com foreach<\/h2>\";\n  foreach ($valores as $valor) {\n    echo $valor . \"<br>\";\n  }\n\n  echo \"<br><h2>Mostrando com print_r<\/h2>\";\n  print_r($valores);\n\n  echo \"<br><h2>Mostrando com var_dump<\/h2>\";\n  var_dump($valores);\n  ?>\n<\/body>\n\n<\/html>", "aula11/exe02.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <form action=\"exe02_mostra.php\">\n    <?php\n    for ($i = 0; $i <= 1; $i++) {\n      for ($c = 0; $c <= 3; $c++) {\n        echo \"<p style='color:#000'>Matriz [$i, $c]<\/p> <input type='text' name=m$i$c>\";\n      }\n    }\n    ?>\n    <input type=\"submit\" value=\"Enviar\">\n  <\/form>\n<\/body>\n\n<\/html>", "aula11/exe02_mostra.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <?php\n  echo \"<h2>Recebendo os dados e mostrando com echo<\/h2>\";\n  for ($i = 0; $i <= 1; $i++) {\n    for ($c = 0; $c <= 3; $c++) {\n      $valores[$i][$c] = $_GET[\"m$i$c\"];\n      echo \"Matriz [$i] [$c] = \" . $_GET[\"m$i$c\"] . \"<br><br>\";\n    }\n  }\n\n  echo \"<h2>Mostrando com foreach<\/h2>\";\n  foreach ($valores as $chaveA => $linha) {\n    echo \"--> Linha: $chaveA\" . \"<br>\";\n    foreach ($linha as $chaveB => $coluna) {\n      echo \"Coluna $chaveB: $coluna\" . \"<br>\";\n    }\n  }\n\n  echo \"<h2>Mostrando com print_r<\/h2>\";\n  echo \"<pre>\";\n  print_r($valores);\n  echo \"<\/pre>\";\n\n  echo \"<h2>Mostrando com var_dump<\/h2>\";\n  echo \"<pre>\";\n  var_dump($valores);\n  echo \"<\/pre>\";\n  ?>\n<\/body>\n\n<\/html>", "aula11/vetor1.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<bod $clientes[0][\"cidade\"] = \"Jales/SP\";\n\n  $clientes[1][\"nome\"] = \"Maria Souza\";\n  $clientes[1][\"sexo\"] = \"Feminino\";\n  $clientes[1][\"cidade\"] = \"Urânia/SP\";\n\n  echo \"<h1>Mostrando com print_r<\/h1>\";\n  print_r($clientes);\n\n  echo \"<h1>Percorrendo um array com foreach mostrando suas chaves<\/h1>\";\n  foreach ($clientes as $chaveA => $linha) {\n    echo \"--> Cliente: $chaveA <br>\";\n\n    foreach ($linha as $chaveB => $coluna) {\n      echo \"$chaveB: $coluna | \";\n    }\n\n    echo \"<br>\";\n  }\n  ?>\n<\/body>\n\n<\/html>", "aula13/index.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Vetores e matriz<\/title>\n  <link rel=\"stylesheet\" href=\"../style.css\">\n<\/head>\n\n<body>\n  <pre>\n    <?php\n    require_once 'Veiculo.php';\n\n    $carro = new Veiculo;\n    $carro->nome = \"Gol\";\n    $carro->cor = \"Branco\";\n    $carro->ano = 2015;\n\n    echo \"<h2>Mostrando o objeto carro com var_dump<\/h2>\";\n    var_dump($carro);\n\n    echo \"<h2>Mostrando o objeto carro com print_r<\/h2>\";\n    print_r($carro);\n\n    echo \"<h2>Mostrando os métodos<\/h2>\";\n    echo \"<p>Botão = true<\/p>\";\n    $carro->botao = true;\n    $carro->acelerar();\n\n    echo \"<br>\";\n\n    echo \"<p>Botão = false<\/p>\";\n    $carro->botao = false;\n    $carro->acelerar();\n\n    echo \"<br>\";\n\n    echo \"<p>Carro -> ligar()<\/p>\";\n    $carro->ligar();\n    $carro->acelerar();\n\n    echo \"<br>\";\n\n    echo \"<p>Carro -> desligar()<\/p>\";\n    $carro->desligar();\n    $carro->acelerar();\n    ?>\n<\/pre>\n<\/body>\n\n<\/html>", "aula13/Veiculo.php": "<?php\nclass Veiculo\n{\n  public $nome;\n  public $cor;\n  public $ano;\n  public $botao;\n\n  public function acelerar()\n  {\n    if ($this->botao == true) {\n      echo \"<p>O carro está acelerando...<\/p>\";\n    } else {\n      echo \"<p>O carro está parado...<\/p>\";\n    }\n  }\n\n  public function ligar()\n  {\n    $this->botao = true;\n  }\n\n  public function desligar()\n  {\n    $this->botao = false;\n  }\n}", "atividade-05/index.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Ligação telefônica - Desafio 17<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n\n<body>\n  <main class=\"cartao\">\n    <h1>Cobrança de ligação telefônica<\/h1>\n    <p class=\"subtitulo\">Informe o horário da ligação e o valor do minuto.<\/p>\n\n    <form action=\"calcular.php\" method=\"post\">\n      <fieldset>\n        <legend>Horário inicial<\/legend>\n        <div class=\"linha\">\n          <label>Hora <input type=\"number\" name=\"horaInicial\" min=\"0\" max=\"23\" required><\/label>\n          <label>Minuto <input type=\"number\" name=\"minInicial\" min=\"0\" max=\"59\" required><\/label>\n        <\/div>\n      <\/fieldset>\n\n      <fieldset>\n        <legend>Horário final<\/legend>\n        <div class=\"linha\">\n          <label>Hora <input type=\"number\" name=\"horaFinal\" min=\"0\" max=\"23\" required><\/label>\n          <label>Minuto <input type=\"number\" name=\"minFinal\" min=\"0\" max=\"59\" required><\/label>\n        <\/div>\n      <\/fieldset>\n\n      <fieldset>\n        <legend>Valor normal do minuto<\/legend>\n        <label>R$ <input type=\"text\" name=\"valor\" inputmode=\"decimal\" placeholder=\"0,50\" required><\/label>\n      <\/fieldset>\n\n      <button type=\"submit\">Calcular<\/button>\n    <\/form>\n  <\/main>\n<\/body>\n\n<\/html>", "atividade-05/calcular.php": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Resultado da ligação<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n\n<body>\n  <!--\n    Capítulo 13, Desafio 17 (p. 553): cobrança de ligação com desconto por horário.\n    \n    - 0h às 9h -> 50% de desconto\n    - 9h às 18h -> 0% de desconto\n    - 18h às 21h -> 30% de desconto\n    - 21h às 24h -> 40% de desconto\n  -->\n\n  <main class=\"cartao\">\n    <h1>Resultado da ligação<\/h1>\n    <div class=\"resultado\">\n      <?php\n      $horaInicial = $_POST['horaInicial'] ?? 0;\n      $minInicial = $_POST['minInicial'] ?? 0;\n      $horaFinal = $_POST['horaFinal'] ?? 0;\n      $minFinal = $_POST['minFinal'] ?? 0;\n      $valorMinuto =  str_replace(',', '.', $_POST['valor'] ?? '0');\n\n      $inicio = $horaInicial * 60 + $minInicial;\n      $fim = $horaFinal * 60 + $minFinal;\n\n      if ($fim < $inicio) {\n        $fim = $fim + 1440;\n      }\n\n      $valorTotal = 0;\n      $valorComDesconto = 0;\n\n      for ($minuto = $inicio; $minuto < $fim; $minuto++) {\n        $hora = floor(($minuto % 1440) / 60);\n\n        if ($hora < 9) {\n          $desconto = 50;\n        } elseif ($hora < 18) {\n          $desconto = 0;\n        } elseif ($hora < 21) {\n          $desconto = 30;\n        } else {\n          $desconto = 40;\n        }\n\n        $valorTotal += $valorMinuto;\n        $valorComDesconto += $valorMinuto * (100 - $desconto) / 100;\n      }\n\n      $duracao = $fim - $inicio;\n      $horas = intdiv($duracao, 60);\n      $resto = $duracao % 60;\n      ?>\n\n      <p>\n        Duração\n        <strong>\n          <?= $duracao . ' minutos (' . $horas . 'h ' . $resto . 'min)' ?>\n        <\/strong>\n      <\/p>\n\n      <p>\n        Valor total\n        <strong>\n          <?= 'R$' . number_format($valorTotal, 2, ',', '.') ?>\n        <\/strong>\n      <\/p>\n\n      <p>\n        Desconto concedido\n        <strong>\n          <?= 'R$' . number_format($valorTotal - $valorComDesconto, 2, ',', '.') ?>\n        <\/strong>\n      <\/p>\n\n      <p class=\"destaque\">\n        Valor final\n        <strong>\n          <?= 'R$' . number_format($valorComDesconto, 2, ',', '.') ?>\n        <\/strong>\n      <\/p>\n    <\/div>\n\n    <a class=\"botao\" href=\"index.html\">Nova ligação<\/a>\n  <\/main>\n<\/body>\n\n<\/html>", "atividade-05/style.css": "@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');\n\n:root {\n  color-scheme: dark;\n\n  --cor-fundo: #0b0f14;\n  --cor-cartao: #151c26;\n  --cor-campo: #0f151d;\n  --cor-borda: #243040;\n  --cor-texto: #e6edf3;\n  --cor-suave: #8b98a9;\n  --cor-destaque: #2dd4bf;\n  --cor-destaque-clara: #5eead4;\n  --cor-sobre-destaque: #04201c;\n  --cor-erro: #ffb4ab;\n  --cor-erro-fundo: #3b1d1d;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  padding: 2.5rem 1rem;\n  min-height: 100vh;\n  font-family: Roboto, sans-serif;\n  background: linear-gradient(160deg, var(--cor-fundo), #131c28);\n  color: var(--cor-texto);\n}\n\n.cartao {\n  max-width: 520px;\n  margin: 0 auto;\n  padding: 2rem 2rem 2.25rem;\n  background: var(--cor-cartao);\n  border: 1px solid var(--cor-borda);\n  border-top: 4px solid var(--cor-destaque);\n  border-radius: 10px;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);\n}\n\nh1 {\n  margin: 0 0 .4rem;\n  font-size: 1.6rem;\n  text-align: left;\n  color: var(--cor-texto);\n}\n\n.subtitulo {\n  margin: 0 0 1.75rem;\n  color: var(--cor-suave);\n}\n\nfieldset {\n  margin: 0 0 1.5rem;\n  padding: 0;\n  border: 0;\n}\n\nlegend {\n  margin-bottom: .6rem;\n  padding: 0;\n  font-size: .75rem;\n  font-weight: bold;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--cor-destaque);\n}\n\n.linha {\n  display: flex;\n  gap: 1rem;\n}\n\nlabel {\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  gap: .3rem;\n  font-size: .8rem;\n  color: var(--cor-suave);\n}\n\ninput {\n  padding: .7rem .85rem;\n  font-size: 1rem;\n  color: var(--cor-texto);\n  background: var(--cor-campo);\n  border: 1px solid var(--cor-borda);\n  border-radius: 6px;\n}\n\ninput::placeholder {\n  color: #5b6778;\n}\n\ninput:focus {\n  outline: none;\n  border-color: var(--cor-destaque);\n  box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.25);\n}\n\nbutton,\n.botao {\n  display: block;\n  width: 100%;\n  padding: .8rem;\n  font-size: 1rem;\n  font-weight: bold;\n  text-align: center;\n  text-decoration: none;\n  color: var(--cor-sobre-destaque);\n  background: var(--cor-destaque);\n  border: 0;\n  border-radius: 6px;\n  cursor: pointer;\n}\n\nbutton:hover,\n.botao:hover {\n  background: var(--cor-destaque-clara);\n}\n\n.resultado {\n  margin: 1.25rem 0 1.75rem;\n}\n\n.resultado p {\n  display: flex;\n  justify-content: space-between;\n  gap: 1rem;\n  margin: 0;\n  padding: .8rem 0;\n  border-bottom: 1px solid var(--cor-borda);\n}\n\n.resultado p strong {\n  text-align: right;\n}\n\n.resultado .destaque {\n  margin: .75rem 0;\n  padding: .9rem 1rem;\n  font-size: 1.15rem;\n  color: var(--cor-destaque);\n  background: rgba(45, 212, 191, 0.1);\n  border: 1px solid rgba(45, 212, 191, 0.4);\n  border-radius: 8px;\n}\n\n.erro {\n  margin: 1.25rem 0 1.75rem;\n  padding: .8rem 1rem;\n  color: var(--cor-erro);\n  background: var(--cor-erro-fundo);\n  border-left: 4px solid var(--cor-erro);\n  border-radius: 6px;\n}"};

    const texto = document.querySelector("#cod-texto");
    const abas = document.querySelector("#abas");
    let arquivoAtual = "";

    // Ignora maiúsculas e acentos na busca
    const limpa = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    function criar(tag, conteudo, classe) {
      const el = document.createElement(tag);
      el.textContent = conteudo;
      if (classe) el.className = classe;
      return el;
    }

    function mostrar(caminho) {
      arquivoAtual = caminho;
      texto.textContent = fontes[caminho];
      texto.scrollTop = 0;
      abas.querySelectorAll("button").forEach(b => b.classList.toggle("ativa", b.dataset.arq === caminho));
    }

    function abrirCodigo(item) {
      document.querySelector("#cod-titulo").textContent = item.t;
      abas.innerHTML = "";
      item.arq.forEach(caminho => {
        const b = criar("button", caminho.split("/").pop());
        b.type = "button";
        b.dataset.arq = caminho;
        b.addEventListener("click", () => mostrar(caminho));
        abas.append(b);
      });
      mostrar(item.arq[0]);
      document.querySelector("#copiar").textContent = "Copiar código";
      dlg.showModal();
    }

    function desenhar(filtro) {
      const busca = limpa(filtro.trim());
      lista.innerHTML = "";
      aulas.forEach(aula => {
        const encontrados = aula.itens.filter(i => limpa(`${aula.num} ${aula.titulo} ${i.t}`).includes(busca));
        if (!encontrados.length) return;

        const cartao = document.createElement("article");
        cartao.className = "aula";
        cartao.append(criar("h2", aula.num), criar("p", aula.titulo));

        const ul = document.createElement("ul");
        encontrados.forEach(item => {
          const li = document.createElement("li");
          const acoes = criar("span", "", "acoes");

          const abrir = criar("a", "Abrir");
          abrir.href = item.href;
          abrir.target = "_blank";
          abrir.rel = "noopener";
          acoes.append(abrir);

          if (item.arq.length) {
            const codigo = criar("button", "Ver código");
            codigo.type = "button";
            codigo.addEventListener("click", () => abrirCodigo(item));
            acoes.append(codigo);
          }

          li.append(criar("span", item.t, "nome"), acoes);
          ul.append(li);
        });
        cartao.append(ul);
        lista.append(cartao);
      });
      vazio.hidden = lista.children.length > 0;
    }

    document.querySelector("#busca").addEventListener("input", e => desenhar(e.target.value));
    document.querySelector("#fechar").addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

    document.querySelector("#copiar").addEventListener("click", async e => {
      try {
        await navigator.clipboard.writeText(fontes[arquivoAtual]);
        e.target.textContent = "Código copiado";
      } catch {
        // Sem permissão de área de transferência: seleciona o texto para copiar com Ctrl+C
        getSelection().selectAllChildren(texto);
        e.target.textContent = "Selecionado: use Ctrl+C";
      }
    });

    desenhar("");
  </script>
</body>

</html>
